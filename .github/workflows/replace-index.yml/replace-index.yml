name: Replace index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file over index.html
        run: mv cairo-frequency-deploy.html index.html
      - name: Commit updated index.html
        run: |
          git config user.name "cairofrequency"
          git config user.email "cairofrequency@users.noreply.github.com"
          git add index.html cairo-frequency-deploy.html
          git commit -m "Deploy updated site: Kadim Al Sahir - Ikhdim Nafsak"
          git push

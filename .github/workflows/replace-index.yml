name: Replace index.html

on:
  workflow_dispatch:

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: mv cairo-frequency-deploy.html index.html
      - name: Commit and push
        run: |
          git config user.name "cairofrequency"
          git config user.email "cairofrequency@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with corrected homepage"
          git push

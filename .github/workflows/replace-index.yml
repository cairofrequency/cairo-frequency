name: Replace index.html with new homepage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move new homepage over index.html
        run: |
          git config user.name "cairofrequency"
          git config user.email "cairofrequency@users.noreply.github.com"
          mv cairo-frequency-deploy.html index.html
          git add index.html cairo-frequency-deploy.html
          git commit -m "Replace index.html with updated homepage - Haifa Wehbe Law Khayef first"
          git push

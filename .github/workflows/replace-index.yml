name: Replace index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded file
        run: |
          mv cairo-frequency-deploy.html index.html
          git config user.name "cairofrequency"
          git config user.email "cairofrequency@users.noreply.github.com"
          git add index.html cairo-frequency-deploy.html
          git commit -m "Deploy updated homepage - Ziad Zaza postpones 7 new songs"
          git push

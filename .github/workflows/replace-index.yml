name: Replace index.html with updated site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Replace index.html with the uploaded file
        run: |
          ls -l cairo-frequency.html index.html
          mv -f cairo-frequency.html index.html
          rm -f .github/workflows/replace-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Mohamed Kilany 'Ma Motnash' story"
          git push
